<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Cocteles - Bartender</title>
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/cocteles.css">
    <link rel="stylesheet" href="../assets/components/header.css">
    <link rel="stylesheet" href="../assets/components/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="cocteles-main">
        <h1 class="section-title">CARTA DE COCTELES</h1>
        <div class="filtros-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="buscador" placeholder="Buscar cóctel...">
            </div>

            <div class="categorias-tabs">
                <button class="tab-btn active" onclick="filtrarCategoria('todos')">Todos</button>
                <button class="tab-btn" onclick="filtrarCategoria('pisco')">Pisco</button>
                <button class="tab-btn" onclick="filtrarCategoria('ron')">Ron</button>
                <button class="tab-btn" onclick="filtrarCategoria('vodka')">Vodka</button>
                <button class="tab-btn" onclick="filtrarCategoria('gin')">Gin</button>
                <button class="tab-btn" onclick="filtrarCategoria('tequila')">Tequila</button>
            </div>
        </div>
        <div class="cocteles-grid" id="grid-cocteles"></div>


        <div id="modal-coctel" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2 id="modal-titulo"></h2>
                <img id="modal-img" src="" alt="">
                <p id="modal-ingredientes"></p>
                <div class="lista-variedades"></div>
            </div>
        </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>


    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/cocteles.js"></script>

</body>

</html>
