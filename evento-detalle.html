<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Evento</title>
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/evento-detalle.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div id="header-container"></div>

    <main class="detalle-evento">
        <h1 id="evento-titulo" class="pícara"></h1>
        <!-- Quitamos el ID de ubicación para que no salga el 'undefined' de main.js -->
        <p class="sub-pícara">Selecciona un evento para ver los detalles</p>

        <!-- AQUÍ SE CARGARÁN LAS CARDS -->
        <div id="eventos-destacados-container" class="eventos-grid"></div>

        <!-- MODAL OCULTO -->
        <div id="modal-galeria" class="modal-overlay" style="display:none;">
            <div class="modal-content">
                <span class="close-btn" onclick="cerrarModal()">&times;</span>
                <h2 id="modal-titulo-evento" style="color: #d4af37;"></h2>
                <div id="modal-grid"></div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="assets/js/evento-detalle.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
